syntax = "proto3";
package scholarmaster.core;

// ==============================================================================
// Paper 20: The ScholarMaster Architecture Reference Model
// ------------------------------------------------------------------------------
// Canonical Protobuf Schema (L3 to L4 Execution Contract)
// 
// This file formally defines the absolute "Irreversibility Boundary".
// It is structurally impossible to serialize a RAW_IMAGE array or pass an 
// identity string across this layer.
// ==============================================================================

message AbstractEvent {
  // Epoch timing bounds
  uint64 timestamp_ms = 1;
  
  // Logical mapping (Not absolute GPS coords)
  uint32 spatial_zone_id = 2;
  
  // Categorical Inference Results (Dimensionality reduction)
  enum EventType {
    UNKNOWN = 0;
    HAND_RAISE = 1;         // Paper 3 Focus
    GAIT_ANOMALY = 2;       // Paper 17 Focus
    ACOUSTIC_IMPULSE = 3;   // Paper 6 Focus
  }
  EventType type = 3;
  
  // Ephemeral tracing token (Valid for 1 frame only)
  // Strictly non-correlatable to permanent Database ID
  uint64 session_ephemeral_token = 4;
  
  // Dimensionality bounded constraint (INV-10)
  // Replaces millions of RGB pixels with ~33 float vectors
  repeated float geometric_keypoints = 5; 
}
